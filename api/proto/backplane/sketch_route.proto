syntax = "proto3";

package kiapi.backplane;

import "common/types/base_types.proto";
import "board/board_types.proto";


// Corner style of routes made by SketchRoute.
enum SketchRouteCornerMode
{
  SRCM_UNKNOWN = 0;

  // 45 degree corners (the default).
  SRCM_MITERED_45 = 1;

  // 45 degree corners rounded with arcs.
  SRCM_ROUNDED_45 = 2;

  // 90 degree corners.
  SRCM_MITERED_90 = 3;

  // 90 degree corners rounded with arcs.
  SRCM_ROUNDED_90 = 4;
}


// Routes the unrouted connections between the given items with the sketch router.
message SketchRoute
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Pads, footprints (standing for all of their pads), tracks or vias whose unrouted
  // connections should be routed.  When empty, the current selection is used.
  repeated kiapi.common.types.KIID items = 2;

  // Optional path for the bundle to follow.  Arcs are approximated.
  kiapi.common.types.PolyLine guide = 3;

  // Copper layer the routes should keep to where they can.  BL_UNDEFINED (or unset) lets the
  // router pick.  Plane layers are never routed on.
  kiapi.board.types.BoardLayer preferred_layer = 4;

  // Defaults to SRCM_MITERED_45.
  SketchRouteCornerMode corner_mode = 5;

  // When true, connections that cannot be routed without a via are left unrouted.
  bool disallow_vias = 6;

  // Time limit for the whole operation, in milliseconds; 0 for the router's default.
  uint32 time_limit_ms = 7;
}


message SketchRouteResponse
{
  // Unrouted connections found among the requested items.
  int32 connections = 1;

  // Connections that were routed.
  int32 routed = 2;

  // Connections that could not be routed.
  int32 failed = 3;

  // Vias added.
  int32 vias = 4;

  // Total length of the new tracks, in nanometers.
  int64 length_nm = 5;

  // True if the time limit ran out before every connection was tried.
  bool timed_out = 6;

  // Time taken by the router, in milliseconds.
  double elapsed_ms = 7;

  // Tracks, arcs and vias created.
  repeated kiapi.common.types.KIID created_items = 8;
}
