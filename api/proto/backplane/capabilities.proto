syntax = "proto3";

package kiapi.backplane;

message GetCapabilities
{
}

message GetCapabilitiesResponse
{
  string fork_version = 1;
  string upstream_commit = 2;
  string source_commit = 3;
  int32 api_version = 4;
  repeated string capabilities = 5;
  repeated string commands = 6;
  int32 board_file_version = 7;
  int32 schematic_file_version = 8;
}
