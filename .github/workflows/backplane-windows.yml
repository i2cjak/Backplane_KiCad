name: Backplane KiCad Windows

on:
  workflow_dispatch:
  pull_request:
    branches: ['backplane/master']
  push:
    branches: ['backplane/master']

permissions:
  contents: read

concurrency:
  group: windows-kicad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Native Windows x64 runtime and IPC
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: C:\bp\vcpkg
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://gitlab.com/api/v4/projects/27426693/packages/nuget/index.json,read;files,C:\bp\vcpkg-cache,readwrite'
      VCPKG_DEFAULT_BINARY_CACHE: C:\bp\vcpkg-cache
      VCPKG_MAX_CONCURRENCY: '4'
    steps:
      - name: Preserve LF and enable Git long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native IPC test client
        # The pinned vcpkg graph supplies protoc 33.4 (Python gencode 6.33.4).
        run: python -m pip install protobuf==6.33.4 pynng==0.9.0
      - uses: actions/cache@v4
        with:
          path: C:\bp\vcpkg-cache
          key: kicad-windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/custom_vcpkg_triplets/**') }}
          restore-keys: kicad-windows-vcpkg-
      - name: Build, relocate, test and package
        shell: pwsh
        run: ./scripts/backplane-windows.ps1
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kicad-diagnostics
          retention-days: 7
          path: |
            C:/bp/build/CMakeCache.txt
            C:/bp/build/CMakeFiles/CMakeConfigureLog.yaml
            C:/bp/build/vcpkg-manifest-install.log
          if-no-files-found: ignore
      - name: Preserve unvalidated installed runtime after a test failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'release\windows\backplane-kicad-windows-x86_64-10.99.0-bp.4'
          if (!(Test-Path $candidate)) { $candidate = 'C:\bp\stage' }
          # Only preserve an install whose dependency-license assembly finished.
          # This is debugging material, never the validated release artifact.
          if (Test-Path (Join-Path $candidate 'licenses\VCPKG_PACKAGES.txt')) {
            $out = Join-Path $env:GITHUB_WORKSPACE 'windows-unvalidated-diagnostics'
            New-Item -ItemType Directory -Force $out | Out-Null
            git rev-parse HEAD | Set-Content (Join-Path $out 'SOURCE_COMMIT')
            Set-Content (Join-Path $out 'UNVALIDATED.txt') 'Native install only. Runtime tests failed; do not treat this as an accepted runtime or release.'
            Compress-Archive -Path $candidate -DestinationPath (Join-Path $out 'unvalidated-runtime.zip')
            git archive --format=tar.gz --prefix=source/ "--output=$out/source.tar.gz" HEAD
            Get-ChildItem $out -File | Where-Object Name -ne SHA256SUMS | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content (Join-Path $out 'SHA256SUMS')
          }
      - name: Upload unvalidated runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kicad-unvalidated-diagnostics
          retention-days: 1
          compression-level: 0
          path: windows-unvalidated-diagnostics/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-kicad-windows-x86_64
          retention-days: 7
          compression-level: 0
          path: |
            release/windows/*.zip
            release/windows/*.tar.gz
            release/windows/SHA256SUMS
          if-no-files-found: error
