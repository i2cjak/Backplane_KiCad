name: Backplane KiCad Linux release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ''
  push:
    tags:
      - 'backplane-kicad-v*'

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Install KiCad build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config ccache \
            libboost-all-dev libbz2-dev libcairo2-dev libcurl4-openssl-dev \
            libeigen3-dev libfontconfig1-dev libfreetype6-dev libgl-dev \
            libglm-dev \
            libgl1-mesa-dev libglew-dev libglu1-mesa-dev libglib2.0-dev \
            libgtk-3-dev libharfbuzz-dev libgit2-dev libssl-dev \
            libngspice0-dev ngspice libnng-dev libocct-data-exchange-dev \
            libocct-foundation-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-ocaf-dev \
            libocct-visualization-dev libpixman-1-dev libpng-dev \
            libpoppler-dev libpoppler-glib-dev libprotobuf-dev \
            libsecret-1-dev libspnav-dev libtool \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libyaml-cpp-dev \
            libzstd-dev mesa-common-dev pax-utils protobuf-compiler \
            python3-dev python3-venv rapidjson-dev shared-mime-info swig unixodbc-dev \
            zlib1g-dev libzint-dev

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: kicad-ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            kicad-ccache-${{ runner.os }}-

      - name: Configure
        run: |
          ccache --max-size=2G
          cmake -S . -B build/backplane-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_BUILD_I18N=OFF \
            -DKICAD_USE_SENTRY=OFF \
            -DKICAD_SCRIPTING_WXPYTHON=OFF \
            -DKICAD_USE_PCH=OFF \
            -DKICAD_IPC_API=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile IPC backports first
        run: |
          cmake --build build/backplane-linux --parallel 4 --target kiapi
          ninja -C build/backplane-linux -j4 \
            common/CMakeFiles/common.dir/api/api_enums.cpp.o \
            eeschema/CMakeFiles/eeschema_kiface_objects.dir/api/api_handler_sch.cpp.o \
            eeschema/CMakeFiles/eeschema_kiface_objects.dir/api/api_sch_enums.cpp.o \
            eeschema/CMakeFiles/eeschema_kiface_objects.dir/api/api_sch_utils.cpp.o \
            eeschema/CMakeFiles/eeschema_kiface_objects.dir/api/sch_api_save.cpp.o \
            eeschema/CMakeFiles/eeschema_kiface_objects.dir/sch_symbol.cpp.o \
            pcbnew/CMakeFiles/pcbnew_kiface_objects.dir/api/api_handler_pcb.cpp.o

      - name: Build and install KiCad runtime
        run: |
          cmake --build build/backplane-linux --parallel 4
          cmake --install build/backplane-linux

      - name: Preserve compiler cache after build attempts
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Install IPC smoke test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ipc-smoke-venv"
          "$RUNNER_TEMP/ipc-smoke-venv/bin/pip" install protobuf==5.29.6 pynng==0.9.0

      - name: Assemble runtime archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(stage/bin/kicad-cli --version | head -n 1 | tr ' /' '__')"
          archive_root="backplane-kicad-linux-x86_64-${version}"
          mkdir -p "release/${archive_root}/licenses"
          cp -a stage/. "release/${archive_root}/"
          cp LICENSE* AUTHORS.txt README.md "release/${archive_root}/licenses/"
          cp -a /usr/share/common-licenses "release/${archive_root}/licenses/"
          mkdir -p "release/${archive_root}/licenses/vendor"
          while IFS= read -r -d '' notice; do
            cp --parents "$notice" "release/${archive_root}/licenses/vendor/"
          done < <(find thirdparty -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'COPYRIGHT*' \) -print0)
          git rev-parse HEAD > "release/${archive_root}/SOURCE_COMMIT"
          git describe --tags --always > "release/${archive_root}/SOURCE_VERSION"
          source_commit="$(git rev-parse HEAD)"
          cat > "release/${archive_root}/manifest.json" <<MANIFEST
          {
            "sourceRepository": "https://github.com/i2cjak/Backplane_KiCad",
            "sourceCommit": "${source_commit}",
            "version": "${version}",
            "license": "GPL-3.0-or-later"
          }
          MANIFEST
          git archive --format=tar.gz --prefix="${archive_root}-source/" HEAD > "release/${archive_root}-source.tar.gz"
          # ngspice and its code models are loaded dynamically, outside ELF NEEDED.
          mkdir -p "release/${archive_root}/lib/ngspice"
          cp -L /usr/lib/x86_64-linux-gnu/libngspice.so.0 "release/${archive_root}/lib/"
          cp -L /usr/lib/x86_64-linux-gnu/ngspice/*.cm "release/${archive_root}/lib/ngspice/"
          mapfile -d '' elf_files < <(find "release/${archive_root}" -type f \( -perm /111 -o -name '*.so*' -o -name '*.cm' \) -print0)
          declare -A package_notices=()
          record_package_notice() {
            local package_id="$1"
            if [ -n "${package_notices[$package_id]+set}" ]; then return; fi
            package_notices[$package_id]=1
            local notice_dir="release/${archive_root}/licenses/debian/${package_id}"
            mkdir -p "$notice_dir"
            dpkg-query -W -f='Package: ${binary:Package}\nVersion: ${Version}\nSource: ${source:Package}\nSource-Version: ${source:Version}\nSource-URL: https://launchpad.net/ubuntu/+source/${source:Package}/${source:Version}\nArchitecture: ${Architecture}\n' "$package_id" > "$notice_dir/metadata.txt"
            local copyright_file="/usr/share/doc/${package_id%%:*}/copyright"
            if [ ! -f "$copyright_file" ]; then
              copyright_file="$(dpkg -L "$package_id" | grep -E '/copyright$' | head -n 1 || true)"
            fi
            test -f "$copyright_file"
            cp "$copyright_file" "$notice_dir/copyright"
          }
          record_package_notice ngspice
          record_package_notice libngspice0
          for binary in "${elf_files[@]}"; do
            file -b "$binary" | grep -q 'ELF' || continue
            lddtree -l "$binary" > "$RUNNER_TEMP/kicad-library-list"
            while IFS= read -r library; do
              case "$library" in
                /*)
                  mkdir -p "release/${archive_root}/lib"
                  destination="release/${archive_root}/lib/$(basename "$library")"
                  if [ -f "$destination" ]; then
                    cmp --silent "$library" "$destination" || { echo "Conflicting runtime library: $library" >&2; exit 1; }
                  else
                    cp -L "$library" "$destination"
                  fi
                  package_id="$(dpkg-query -S "$library" "$(realpath "$library")" 2>/dev/null | sed -n '1s/: .*//p' || true)"
                  if [ -n "$package_id" ]; then record_package_notice "$package_id"; fi
                  ;;
              esac
            done < "$RUNNER_TEMP/kicad-library-list"
          done
          mv "release/${archive_root}/bin/kicad-cli" "release/${archive_root}/bin/kicad-cli.real"
          cat > "release/${archive_root}/bin/kicad-cli" <<'LAUNCHER'
          #!/usr/bin/env sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export KICAD_KIFACE_HOME="$root/bin"
          export KICAD_STOCK_DATA_HOME="$root/share/kicad"
          export KICAD_STOCK_PLUGIN_HOME="$root/lib/kicad/plugins"
          exec "$root/lib/ld-linux-x86-64.so.2" --library-path "$root/lib" "$root/bin/kicad-cli.real" "$@"
          LAUNCHER
          chmod +x "release/${archive_root}/bin/kicad-cli"
          {
            echo "Backplane KiCad Linux runtime"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Source version: $(git describe --tags --always)"
            echo "IPC API: enabled"
            echo "Entry point: bin/kicad-cli api-server"
          } > "release/${archive_root}/RUNTIME_MANIFEST.txt"
          # The runtime must work after relocation, with its build prefix absent.
          mv stage "$RUNNER_TEMP/kicad-build-stage"
          "release/${archive_root}/bin/kicad-cli" --version
          "release/${archive_root}/bin/kicad-cli" api-server --help
          "$RUNNER_TEMP/ipc-smoke-venv/bin/python" scripts/backplane-ipc-smoke.py "release/${archive_root}/bin/kicad-cli"
          (cd release && tar -czf "${archive_root}.tar.gz" "${archive_root}")
          (cd release && sha256sum "${archive_root}.tar.gz" "${archive_root}-source.tar.gz" > SHA256SUMS)

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: backplane-kicad-linux-x86_64
          compression-level: 0
          retention-days: 1
          path: |
            release/backplane-kicad-linux-x86_64-*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/backplane-kicad-v')
    needs: linux-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: backplane-kicad-linux-x86_64
          path: release
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
