name: Backplane KiCad macOS
on:
  push:
    branches: ['impl/macos-native-build']
    paths: ['.github/workflows/backplane-macos.yml', 'scripts/backplane-macos*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-kicad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: Native Apple silicon runtime, relocation and IPC
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.backplane-ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build and test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja pkg-config ccache boost cairo curl eigen fontconfig freetype glew glm harfbuzz libgit2 ngspice nng opencascade pixman protobuf@29 rapidjson unixodbc wxwidgets yaml-cpp zint zstd glslang spirv-tools spirv-cross
          python -m pip install protobuf==5.29.6 pynng==0.9.0
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kicad-macos-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: kicad-macos-${{ runner.arch }}-
      - name: Build, relocate, test and package
        run: |
          python scripts/backplane-macos-relocate-test.py
          bash scripts/backplane-macos.sh
      - name: Retain compiled bundle when a later packaging gate fails
        if: failure()
        run: |
          if [ -x stage-macos/KiCad.app/Contents/MacOS/kicad-cli ]; then
            tar -C stage-macos -czf "$RUNNER_TEMP/backplane-macos-stage.tar.gz" KiCad.app
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-kicad-compiled-stage-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/backplane-macos-stage.tar.gz
          if-no-files-found: ignore
      - name: Preserve compiler work after build attempts
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kicad-diagnostics
          retention-days: 7
          path: |
            build/backplane-macos/CMakeCache.txt
            build/backplane-macos/CMakeFiles/CMakeConfigureLog.yaml
            release/macos/*.json
            release/macos/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-kicad-macos-native
          retention-days: 7
          compression-level: 0
          path: |
            release/macos/*.tar.gz
            release/macos/SHA256SUMS
          if-no-files-found: error
